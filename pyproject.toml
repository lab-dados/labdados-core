[project]
name = "labdados-core"
version = "0.12.0"
description = "Núcleo compartilhado entre o backend do escritório de apoio do LabDados e o SDK Python labdados — lógica que precisa ficar idêntica nos dois lados (análise de viabilidade, regras de veredito, template do relatório)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "LabDados / FGV Direito SP", email = "labdados.direitosp@fgv.br" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# jinja2 para renderizar o template do relatório; juscraper para
# **todas** as chamadas a tribunais (Datajud + cjsg/cjpg). Antes da
# v0.4.0 o Datajud era HTTP direto via httpx, mas isso duplicava regras
# que o juscraper já tinha (alias, payload ES, fallback 504, auth) — ver
# jtrecenti/juscraper#180.
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    # juscraper>=0.3 traz data_ajuizamento_inicio/fim em contar_processos
    # (PR #180, lançado em 2026-05-03 junto desta release).
    "juscraper>=0.3,<1.0",
]

[project.optional-dependencies]
# Para renderização do PDF de viabilidade é necessário também o binário
# do Quarto + Typst no sistema (não dá pra empacotar via pip). Sem o
# Quarto, o render_report devolve só o markdown.
estruturacao = [
    # DataFrameIt orquestra DataFrame -> LLM -> Pydantic com paralelização,
    # retry e checkpoint built-in. Usa langchain-openai por baixo (cobre
    # OpenAI, Azure OpenAI e qualquer endpoint OpenAI-compatible via
    # base_url custom — vLLM, Ollama, LM Studio).
    # Para outros providers: instalar dataframeit[google] ou [anthropic]
    # adicionalmente.
    "dataframeit[openai]>=0.6",
    # openpyxl pra readers de .xlsx.
    "openpyxl>=3.1",
    # pandas pra normalizar inputs em DataFrame antes de chamar dataframeit.
    # (já vem como dep transitiva do dataframeit, mas pinamos para evitar
    # surpresas se eles afrouxarem o pin no futuro.)
    "pandas>=2.0",
]
# OCR CPU: PyMuPDF abre/renderiza o PDF; pytesseract chama o binário do
# Tesseract (instalado pelo OS — não vem via pip). Suficiente para a
# maioria dos PDFs nativos ou scans bem feitos. Sem GPU.
ocr-cpu = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
# OCR GPU: PaddleOCR 3.x — mais preciso em layouts complexos (tabelas,
# colunas, scans ruidosos). Roda em CPU se a GPU não estiver disponível,
# mas vale muito menos a pena. PyMuPDF segue necessário para abrir o PDF.
ocr-gpu = [
    "paddleocr>=3.0,<4",
    "pymupdf>=1.24",
    # numpy vem como dep do paddleocr — não pinamos aqui para não brigar
    # com pandas (puxado pelo extra [estruturacao]). PaddleOCR 3.x aceita
    # numpy 2.x; manter pin obriga rebuild source de numpy 1.26.
]
# Anonimização CPU: openai/privacy-filter via HF Transformers, sem CUDA.
# Funciona pra dev local e modo SDK local. ~10x mais lento que GPU; ok
# pra textos curtos (<5k chars). transformers >=4.45 traz suporte a
# model.config.id2label estável.
anonimizacao-cpu = [
    "transformers>=4.45",
    "torch>=2.2",
    "tokenizers>=0.20",
]
# Anonimização GPU: mesma lib, mas em produção (Container Apps T4) o
# torch precisa vir com CUDA. NÃO pinar aqui — o Dockerfile do
# services/anonimizacao instala torch CUDA via index URL específico
# (https://download.pytorch.org/whl/cu121). Este extra existe para
# documentar a intenção; o consumidor real é o Dockerfile.
anonimizacao-gpu = [
    "transformers>=4.45",
    "torch>=2.2",
    "tokenizers>=0.20",
]
all = [
    "labdados-core[estruturacao]",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "respx>=0.21",
    # Para os tests de estruturação (mockam dataframeit / openai SDK).
    "dataframeit[openai]>=0.6",
    "openpyxl>=3.1",
    "pandas>=2.0",
    # Para o test de integração rodar com OPENAI_API_KEY do .env.
    "python-dotenv>=1.0",
    # Para os tests de OCR — usamos pymupdf para gerar fixtures e
    # mockar pytesseract. Pillow vem como transitive de pytesseract.
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/lab-dados/labdados-core"
Repository = "https://github.com/lab-dados/labdados-core"
Issues = "https://github.com/lab-dados/labdados-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labdados_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/labdados_core/templates/viability_report.qmd" = "labdados_core/templates/viability_report.qmd"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testa contra serviços reais (OpenAI, etc.) — requer credenciais",
]
