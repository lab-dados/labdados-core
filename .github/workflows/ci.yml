name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # Quarto não é necessário aqui — `render_report` faz fallback para
      # markdown puro quando o binário não está no PATH (e os tests usam
      # esse caminho).
      - name: Install
        run: pip install -e ".[dev,estruturacao,ocr-cpu]"
      - name: Lint
        run: ruff check .
      - name: Test (skip integration)
        # tests/test_estruturacao_integration.py exige OPENAI_API_KEY real
        # e é pulado automaticamente em CI (marker `integration`).
        run: pytest -q -m "not integration"
